{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "scale-service.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scale-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "scale-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.rps.enabled }}
    - type: Pods
      pods:
        metric:
          name: {{ .Values.autoscaling.rps.metricName | quote }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.rps.averageValue | quote }}
    {{- end }}
    {{- if and .Values.autoscaling.basic.enabled .Values.autoscaling.basic.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.basic.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if and .Values.autoscaling.basic.enabled .Values.autoscaling.basic.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.basic.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
